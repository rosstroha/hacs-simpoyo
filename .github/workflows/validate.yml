name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Upstream action still runs the mutable ghcr.io/home-assistant/hassfest image.
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master (2026-10-10)

  hacs:
    runs-on: ubuntu-latest
    steps:
      # Upstream action still runs the mutable ghcr.io/hacs/action:main image.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main (2026-10-10)
        with:
          category: integration
          comment: false

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements_test.txt
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: pytest
      - run: python -m unittest -q test_simpoyo_usage.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test_simpoyo_gauges.js
